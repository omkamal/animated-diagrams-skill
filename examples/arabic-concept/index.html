        <!-- camera rig: ALL pan/zoom animates this group's transform -->
        <g id="camera">
          <!-- anchor pins #camera's bbox origin to the canvas origin so
               transformOrigin "0 0" equals canvas (0,0) — DO NOT REMOVE -->
          <rect id="cam-anchor" x="0" y="0" width="0.01" height="0.01" fill="none" stroke="none"/>
          <g id="layer-regions"><!-- region containers: <g id="region-*" class="region"> --></g>
          <g id="layer-edges">
            <path id="edge-idea-build" class="edge edge--flow" d="M 1380 450 L 1084 450" stroke-dasharray="2 12"/>
            <path id="edge-build-launch" class="edge edge--flow" d="M 840 450 L 544 450" stroke-dasharray="2 12"/>
            <path id="head-idea-build" class="edge-head" d="M 1080 450 l 18 -9 v 18 z"/>
            <path id="head-build-launch" class="edge-head" d="M 540 450 l 18 -9 v 18 z"/>
          </g>
          <g id="layer-nodes">
            <g id="node-idea" class="node-bare"><circle cx="1500" cy="450" r="120" fill="var(--bg-raise)" stroke="var(--region-stroke)" stroke-width="2"/><use href="#clip-noto-light-bulb" x="1422" y="372" width="156" height="156"/><text x="1500" y="650" text-anchor="middle" font-size="44" font-weight="700">فكرة</text></g>
            <g id="node-build" class="node-bare"><circle cx="960" cy="450" r="120" fill="var(--bg-raise)" stroke="var(--region-stroke)" stroke-width="2"/><use href="#clip-noto-hammer-and-wrench" x="882" y="372" width="156" height="156"/><text x="960" y="650" text-anchor="middle" font-size="44" font-weight="700">بناء</text></g>
            <g id="node-launch" class="node-bare"><circle cx="420" cy="450" r="120" fill="var(--bg-raise)" stroke="var(--region-stroke)" stroke-width="2"/><use href="#clip-noto-rocket" x="342" y="372" width="156" height="156"/><text x="420" y="650" text-anchor="middle" font-size="44" font-weight="700">إطلاق</text></g>
            <g id="node-spark"><use href="#clip-noto-sparkles" x="250" y="270" width="84" height="84"/></g>
          </g>
          <g id="layer-labels"><!-- free-standing labels: <text id="label-*" class="label"> --></g>
          <g id="layer-particles"><!-- data pulses: <circle id="pulse-*" class="pulse" r="8" opacity="0"> --></g>
        </g>

        <!-- HUD stays fixed during camera moves -->
        <g id="hud">
          <text id="hud-title" class="title" x="960" y="150" text-anchor="middle" opacity="0">من الفكرة إلى الإطلاق</text>
          <text id="hud-sub" class="subtitle" x="960" y="210" text-anchor="middle" opacity="0">ثلاث خطوات نحو المنتج</text>
        </g>
      </svg>

    <!-- ════════════ TIMELINE (keep INLINE — `hyperframes snapshot` does not
         execute external local scripts; render does, but snapshots are the
         verification loop) ════════════ -->
    <script>
      gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);

      /* ── CAMERA RIG (for large flows — see references/camera-large-flows.md)
         All helpers tween ONLY #camera; HUD stays fixed. getBBox/getPointAtLength
         are deterministic under the frame-seeking renderer. ──────────────── */
      const __root = document.getElementById("root");
      const __W = +__root.dataset.width, __H = +__root.dataset.height;
      const CAM_EASE = "power3.inOut";

      // zoom so `sel`'s bbox is centered; zoom = explicit factor, or auto-fit
      function camFit(tl, sel, { zoom, at = ">", dur = 1.2, pad = 1.25, ease = CAM_EASE } = {}) {
        const b = document.querySelector(sel).getBBox();
        const z = zoom ?? Math.min(__W / (b.width * pad), __H / (b.height * pad), 2.2);
        const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
        return tl.to("#camera", { scale: z, x: __W / 2 - cx * z, y: __H / 2 - cy * z,
          transformOrigin: "0 0", duration: dur, ease }, at);
      }
      // fit the WHOLE scene (use when the diagram is larger than the canvas)
      function camFitAll(tl, opts = {}) { return camFit(tl, "#camera", { pad: 1.08, ...opts }); }
      // straight pan: keep current zoom, center on point (scene coords)
      function camPanTo(tl, cx, cy, z, { at = ">", dur = 1.2, ease = CAM_EASE } = {}) {
        return tl.to("#camera", { scale: z, x: __W / 2 - cx * z, y: __H / 2 - cy * z,
          transformOrigin: "0 0", duration: dur, ease }, at);
      }
      function camHome(tl, { at = ">", dur = 1.1, ease = CAM_EASE } = {}) {
        return tl.to("#camera", { scale: 1, x: 0, y: 0, duration: dur, ease }, at);
      }
      // follow-cam: track a path (the one a pulse rides) keeping it centered
      function camFollow(tl, pathSel, { at = ">", dur = 2, zoom = 1.3, ease = "none" } = {}) {
        const path = document.querySelector(pathSel);
        const len = path.getTotalLength(), prog = { p: 0 };
        return tl.to(prog, { p: 1, duration: dur, ease, onUpdate() {
          const pt = path.getPointAtLength(prog.p * len);
          gsap.set("#camera", { scale: zoom, x: __W / 2 - pt.x * zoom, y: __H / 2 - pt.y * zoom,
            transformOrigin: "0 0" });
        } }, at);
      }
      /* ═══ end camera rig ═══ */

      
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      tl.to("#hud-title", { opacity: 1, duration: 0.6 }, 0)
        .to("#hud-sub", { opacity: 1, duration: 0.6 }, 0.3);

      /* stations pop in right -> left */
      tl.from(["#node-idea","#node-build","#node-launch"], {
        opacity: 0, scale: 0.6, y: 20, transformOrigin: "50% 50%",
        stagger: 0.3, duration: 0.6, ease: "back.out(1.7)" }, 0.8);

      /* gentle idle bob on each emoji station */
      ["#node-idea","#node-build","#node-launch"].forEach((n,i)=>
        tl.to(n, { y: -14, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 2 }, 2.6 + i*0.2));

      /* connectors draw right -> left, heads pop */
      const E=[["#edge-idea-build","#head-idea-build"],["#edge-build-launch","#head-build-launch"]];
      E.forEach(([e,h],i)=>{ const at=2.6+i*0.5;
        tl.from(e,{ drawSVG:"0%", duration:0.5, ease:"power1.inOut" }, at)
          .from(h,{ opacity:0, scale:0, transformOrigin:"50% 50%", duration:0.25, ease:"back.out(2)" }, at+0.4); });

      /* sparkles + launch emphasis */
      tl.from("#node-spark",{ opacity:0, scale:0, transformOrigin:"50% 50%", duration:0.5, ease:"back.out(2)" }, 4.4)
        .to("#node-launch",{ scale:1.12, transformOrigin:"50% 50%", duration:0.4, ease:"expo.out" }, 4.6)
        .to("#node-launch",{ scale:1, duration:0.6, ease:"power2.inOut" }, 5.0)
        .to("#node-launch use",{ rotation:-8, transformOrigin:"50% 70%", duration:0.4, yoyo:true, repeat:1, ease:"sine.inOut" }, 4.7);

      /* drifting dotted flow + hold */
      tl.to(".edge--flow",{ strokeDashoffset:-140, duration:6, ease:"none" }, 3.0)
        .to({}, { duration: 1.4 });

      // Determinism contract: paused + registered; key matches data-composition-id.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      // Browser preview fallback: autoplay when opened directly.
      if (!window.__hyperframes && !navigator.webdriver) {
        document.fonts.ready.then(() => tl.play());
      }
    </script>
