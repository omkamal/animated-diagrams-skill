            </g>

              <text data-hf-id="hf-dz3g" x="1328" y="528" font-size="26" font-weight="600">Checkout API</text>
              <text data-hf-id="hf-qdnu" x="1328" y="562" class="label" font-size="21">Lambda</text>

              <use data-hf-id="hf-2jvd" href="#icon-aws-dynamodb" x="1556" y="643" width="52" height="52" color="var(--c-green)" />

            </g>
          </g>
          <g data-hf-id="hf-sney" id="layer-labels"><!-- free-standing labels: <text id="label-*" class="label"> --></g>
          <g data-hf-id="hf-4v9c" id="layer-particles">
            <circle data-hf-id="hf-kig4" id="pulse-1" class="pulse" r="9" filter="url(#glow)" opacity="0" />

        <!-- HUD stays fixed during camera moves -->
        <g data-hf-id="hf-f0be" id="hud">
          <text data-hf-id="hf-u3ot" id="hud-title" class="title" x="960" y="150" text-anchor="middle" opacity="0">Serverless Checkout</text>
          <text data-hf-id="hf-6czs" id="hud-sub" class="subtitle" x="960" y="200" text-anchor="middle" opacity="0">request path · edge to data</text>
        </g>
      </svg>

    <!-- ════════════ TIMELINE (keep INLINE — `hyperframes snapshot` does not
         execute external local scripts; render does, but snapshots are the
         verification loop) ════════════ -->
    <script>
      gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      /* Act 1 · Establish */
      tl.to("#hud-title", { opacity: 1, duration: 0.6 }, 0)
        .to("#hud-sub", { opacity: 1, duration: 0.6 }, 0.25)
        .from("#region-vpc", { opacity: 0, scale: 0.97, transformOrigin: "50% 50%", duration: 0.8 }, 0.3);

      /* Act 2 · Build — nodes in request-flow order */
      tl.from(["#node-browser", "#node-cdn", "#node-alb", "#node-fn", "#node-db"], {
        opacity: 0, y: 26, scale: 0.85, transformOrigin: "50% 50%",
        stagger: 0.14, duration: 0.55, ease: "back.out(1.4)",
      }, 0.9);

      /* Act 3 · Connect — solid edges draw, heads pop as each lands; dotted flow fades */
      const edges = ["#edge-browser-cdn", "#edge-cdn-alb", "#edge-alb-fn"];
      const heads = ["#head-browser-cdn", "#head-cdn-alb", "#head-alb-fn"];
      edges.forEach((e, i) => {
        const at = 2.4 + i * 0.45;
        tl.from(e, { drawSVG: "0%", duration: 0.55, ease: "power1.inOut" }, at)
          .from(heads[i], { opacity: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(2)" }, at + 0.42);
      });
      tl.from("#edge-fn-db", { opacity: 0, duration: 0.4 }, 3.9)
        .from("#head-fn-db", { opacity: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(2)" }, 4.1);

      /* Act 4 · Flow — a request pulse rides the whole path; dotted line drifts */
      tl.set("#pulse-1", { opacity: 1 }, 4.8);
      edges.forEach((p, i) => {
        tl.to("#pulse-1", {
          motionPath: { path: p, align: p, alignOrigin: [0.5, 0.5] },
          duration: 0.9, ease: "none",
        }, 4.8 + i * 0.9);
      });
      tl.to("#pulse-1", {
        motionPath: { path: "#edge-fn-db", align: "#edge-fn-db", alignOrigin: [0.5, 0.5] },
        duration: 0.9, ease: "none",
      }, 7.5)
        .to("#pulse-1", { opacity: 0, duration: 0.2 }, 8.4);
      tl.to("#edge-fn-db", { strokeDashoffset: -14 * 10, duration: 8, ease: "none" }, 5.0);

      /* emphasis: Lambda pops as the pulse arrives */
      tl.to("#node-fn rect", { scale: 1.05, transformOrigin: "50% 50%", duration: 0.3, ease: "expo.out" }, 6.6)
        .to("#node-fn rect", { scale: 1, duration: 0.5, ease: "power2.in" }, 6.9);

      /* Act 5 · Focus on compute+data, then resolve & hold */
      tl.to("#camera", {
        scale: 1.35, x: 1920 / 2 - 1495 * 1.35, y: 1080 / 2 - 615 * 1.35,
        transformOrigin: "0 0", duration: 1.2, ease: "power3.inOut",
      }, 8.8)
        .to("#camera", { scale: 1, x: 0, y: 0, duration: 1.1, ease: "power3.inOut" }, 11.2)
        .to({}, { duration: 1.7 });   /* hold: 12.3 → 14.0 */

      // Determinism contract: paused + registered; key matches data-composition-id.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      // Browser preview fallback: autoplay when opened directly.
      if (!window.__hyperframes && !navigator.webdriver) {
        document.fonts.ready.then(() => tl.play());
      }
    </script>
