* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  overflow: hidden;
  background: var(--bg);
}

body { font-family: "Inter", sans-serif; }

/* ---- semantic SVG defaults (overridable inline) ---- */

#scene { display: block; }

#scene text {
  font-family: "Inter", sans-serif;
  fill: var(--text);
}

#scene .label   { fill: var(--text-muted); }
#scene .mono    { font-family: "JetBrains Mono", monospace; }

#scene .region > rect,
#scene .region > path {
  fill: var(--region-fill);
  stroke: var(--region-stroke);
  stroke-width: 2;
  stroke-dasharray: 8 6;
}
#scene .region-title { fill: var(--region-stroke); font-size: 26px; letter-spacing: 0.08em; }

#scene .node > rect,
#scene .node > circle,
#scene .node > path.node-shape {
  fill: var(--node-fill);
  stroke: var(--node-stroke);
  stroke-width: 2.5;
}

#scene .edge {
  fill: none;
  stroke: var(--edge);
  stroke-width: 3.5;
  stroke-linecap: round;
}

#scene .edge--flow {           /* dotted data-flow line: animate stroke-dashoffset, NOT drawSVG */
  fill: none;
  stroke: var(--edge);
  stroke-dasharray: 2 12;
  stroke-linecap: round;
  stroke-width: 4;
}

#scene .edge-head { fill: var(--edge); }   /* separate arrowhead, faded in after its edge draws */

#scene .pulse { fill: var(--accent); }

#scene .lifeline { stroke: var(--edge); stroke-width: 2; stroke-dasharray: 6 8; }
#scene .activation { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 2; }

#hud .title    { fill: var(--text); font-size: 54px; font-weight: 650; }
#hud .subtitle { fill: var(--text-muted); font-size: 30px; }
/* theme: dark (default) — deep-space navy with neon accents */
:root {
  --bg:            #0b1021;
  --bg-raise:      #131a33;
  --text:          #f1f5f9;
  --text-muted:    #94a3b8;

  --region-fill:   rgba(56, 189, 248, 0.04);
  --region-stroke: #3b5e8c;

  --node-fill:     #16203d;
  --node-stroke:   #38bdf8;

  --edge:          #64a8e0;
  --accent:        #facc15;

  /* categorical accents for node strokes / icons */
  --c-blue:        #38bdf8;
  --c-violet:      #a78bfa;
  --c-green:       #34d399;
  --c-amber:       #fbbf24;
  --c-rose:        #fb7185;
  --c-cyan:        #22d3ee;
  --c-orange:      #fb923c;
}

    <!-- ════════════ TIMELINE (keep INLINE — `hyperframes snapshot` does not
         execute external local scripts; render does, but snapshots are the
         verification loop) ════════════ -->
    <script>
      gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      /* Act 1 · Establish */
      tl.to("#hud-title", { opacity: 1, duration: 0.6 }, 0)
        .to("#hud-sub", { opacity: 1, duration: 0.6 }, 0.25)
        .from("#region-vpc", { opacity: 0, scale: 0.97, transformOrigin: "50% 50%", duration: 0.8 }, 0.3);

      /* Act 2 · Build — nodes in request-flow order */
      tl.from(["#node-browser", "#node-cdn", "#node-alb", "#node-fn", "#node-db"], {
        opacity: 0, y: 26, scale: 0.85, transformOrigin: "50% 50%",
        stagger: 0.14, duration: 0.55, ease: "back.out(1.4)",
      }, 0.9);

      /* Act 3 · Connect — solid edges draw, heads pop as each lands; dotted flow fades */
      const edges = ["#edge-browser-cdn", "#edge-cdn-alb", "#edge-alb-fn"];
      const heads = ["#head-browser-cdn", "#head-cdn-alb", "#head-alb-fn"];
      edges.forEach((e, i) => {
        const at = 2.4 + i * 0.45;
        tl.from(e, { drawSVG: "0%", duration: 0.55, ease: "power1.inOut" }, at)
          .from(heads[i], { opacity: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(2)" }, at + 0.42);
      });
      tl.from("#edge-fn-db", { opacity: 0, duration: 0.4 }, 3.9)
        .from("#head-fn-db", { opacity: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(2)" }, 4.1);

      /* Act 4 · Flow — a request pulse rides the whole path; dotted line drifts */
      tl.set("#pulse-1", { opacity: 1 }, 4.8);
      edges.forEach((p, i) => {
        tl.to("#pulse-1", {
          motionPath: { path: p, align: p, alignOrigin: [0.5, 0.5] },
          duration: 0.9, ease: "none",
        }, 4.8 + i * 0.9);
      });
      tl.to("#pulse-1", {
        motionPath: { path: "#edge-fn-db", align: "#edge-fn-db", alignOrigin: [0.5, 0.5] },
        duration: 0.9, ease: "none",
      }, 7.5)
        .to("#pulse-1", { opacity: 0, duration: 0.2 }, 8.4);
      tl.to("#edge-fn-db", { strokeDashoffset: -14 * 10, duration: 8, ease: "none" }, 5.0);

      /* emphasis: Lambda pops as the pulse arrives */
      tl.to("#node-fn rect", { scale: 1.05, transformOrigin: "50% 50%", duration: 0.3, ease: "expo.out" }, 6.6)
        .to("#node-fn rect", { scale: 1, duration: 0.5, ease: "power2.in" }, 6.9);

      /* Act 5 · Focus on compute+data, then resolve & hold */
      tl.to("#camera", {
        scale: 1.35, x: 1920 / 2 - 1495 * 1.35, y: 1080 / 2 - 615 * 1.35,
        transformOrigin: "0 0", duration: 1.2, ease: "power3.inOut",
      }, 8.8)
        .to("#camera", { scale: 1, x: 0, y: 0, duration: 1.1, ease: "power3.inOut" }, 11.2)
        .to({}, { duration: 1.7 });   /* hold: 12.3 → 14.0 */

      // Determinism contract: paused + registered; key matches data-composition-id.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      // Browser preview fallback: autoplay when opened directly.
      if (!window.__hyperframes && !navigator.webdriver) {
        document.fonts.ready.then(() => tl.play());
      }
    </script>
  
<style>
  #asvg-bar { position: fixed; left: 16px; right: 16px; bottom: 14px; display: flex;
    gap: 10px; align-items: center; padding: 8px 14px; border-radius: 12px;
    background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(6px);
    font-family: system-ui, sans-serif; z-index: 99; opacity: 0.25; transition: opacity .2s; }
  #asvg-bar:hover { opacity: 1; }
  #asvg-play { width: 34px; height: 34px; border: 0; border-radius: 50%; cursor: pointer;
    background: #38bdf8; color: #0b1021; font-size: 15px; }
  #asvg-scrub { flex: 1; accent-color: #38bdf8; }
  #asvg-time { color: #cbd5e1; font-size: 12px; min-width: 72px; text-align: right; }
</style>
<div id="asvg-bar">
  <button id="asvg-play">⏸</button>
  <input id="asvg-scrub" type="range" min="0" max="1000" value="0" />
  <span id="asvg-time"></span>
</div>
<script>
(function () {
  var tl = (window.__timelines || {}).main;
  if (!tl) return;
  var play = document.getElementById("asvg-play");
  var scrub = document.getElementById("asvg-scrub");
  var time = document.getElementById("asvg-time");
  var dragging = false;
  tl.eventCallback("onUpdate", function () {
    if (!dragging) scrub.value = Math.round(tl.progress() * 1000);
    time.textContent = tl.time().toFixed(1) + " / " + tl.duration().toFixed(1) + "s";
  });
  tl.eventCallback("onComplete", function () { play.textContent = "↻"; });
  play.addEventListener("click", function () {
    if (tl.progress() >= 1) { tl.restart(); play.textContent = "⏸"; }
    else if (tl.paused() || !tl.isActive()) { tl.play(); play.textContent = "⏸"; }
    else { tl.pause(); play.textContent = "▶"; }
  });
  scrub.addEventListener("pointerdown", function () { dragging = true; tl.pause(); play.textContent = "▶"; });
  scrub.addEventListener("pointerup", function () { dragging = false; });
  scrub.addEventListener("input", function () { tl.progress(scrub.value / 1000); });
})();
</script>
