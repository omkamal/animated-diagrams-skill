<!-- generic.svg — original stylized line icons. Each <symbol> uses a 48x48 viewBox,
     stroke="currentColor" so it inherits color from the <use> element.
     Usage: paste needed <symbol>s into composition <defs>, then
     <use href="#icon-database" x=".." y=".." width="44" height="44" color="var(--c-green)"/> -->
<svg xmlns="http://www.w3.org/2000/svg">
  <symbol id="icon-user" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="17" r="8"/>
    <path d="M9 41 c0-9 6.5-13 15-13 s15 4 15 13"/>
  </symbol>
  <symbol id="icon-browser" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="8" width="38" height="32" rx="4"/>
    <path d="M5 17 h38"/>
    <circle cx="11" cy="12.5" r="1.4" fill="currentColor" stroke="none"/>
    <circle cx="16.5" cy="12.5" r="1.4" fill="currentColor" stroke="none"/>
    <circle cx="22" cy="12.5" r="1.4" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="icon-mobile" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="5" width="20" height="38" rx="4"/>
    <path d="M21 38 h6"/>
  </symbol>
  <symbol id="icon-server" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="7" width="32" height="14" rx="3"/>
    <rect x="8" y="27" width="32" height="14" rx="3"/>
    <circle cx="15" cy="14" r="1.6" fill="currentColor" stroke="none"/>
    <circle cx="15" cy="34" r="1.6" fill="currentColor" stroke="none"/>
    <path d="M24 14 h9 M24 34 h9"/>
  </symbol>
  <symbol id="icon-database" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="24" cy="11" rx="15" ry="6"/>
    <path d="M9 11 v26 c0 3.3 6.7 6 15 6 s15-2.7 15-6 V11"/>
    <path d="M9 24 c0 3.3 6.7 6 15 6 s15-2.7 15-6"/>
  </symbol>
  <symbol id="icon-queue" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="18" width="9" height="12" rx="2"/>
    <rect x="19.5" y="18" width="9" height="12" rx="2"/>
    <rect x="34" y="18" width="9" height="12" rx="2"/>
  </symbol>
  <symbol id="icon-cache" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="7" width="34" height="34" rx="5"/>
    <path d="M24 14 l-6 11 h12 l-6 11" stroke-width="3"/>
  </symbol>
  <symbol id="icon-lock" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="21" width="28" height="20" rx="4"/>
    <path d="M16 21 v-6 a8 8 0 0 1 16 0 v6"/>
    <circle cx="24" cy="30" r="3"/>
  </symbol>
  <symbol id="icon-gear" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="7"/>
    <path d="M24 6 v6 M24 36 v6 M6 24 h6 M36 24 h6 M11.3 11.3 l4.2 4.2 M32.5 32.5 l4.2 4.2 M36.7 11.3 l-4.2 4.2 M15.5 32.5 l-4.2 4.2"/>
  </symbol>
  <symbol id="icon-doc" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5 h17 l9 9 v29 H12 z"/>
    <path d="M29 5 v9 h9"/>
    <path d="M18 24 h12 M18 31 h12"/>
  </symbol>
  <symbol id="icon-globe" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="17"/>
    <ellipse cx="24" cy="24" rx="8" ry="17"/>
    <path d="M7 24 h34 M10 14.5 h28 M10 33.5 h28"/>
  </symbol>
  <symbol id="icon-cloud" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 36 a8 8 0 0 1 -1-15.9 a11 11 0 0 1 21.6-2.1 A8.5 8.5 0 0 1 34 36 z"/>
  </symbol>
  <symbol id="icon-shield" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 5 l15 6 v11 c0 10-6.5 17-15 21 c-8.5-4-15-11-15-21 V11 z"/>
    <path d="M17.5 24 l4.5 4.5 l8.5-8.5"/>
  </symbol>
  <symbol id="icon-chart" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 7 v34 h34"/>
    <path d="M14 32 l8-9 l7 5 l11-13"/>
  </symbol>
  <symbol id="icon-bolt" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 5 L13 27 h9 l-3 16 L35 21 h-9 z"/>
  </symbol>
  <symbol id="icon-mail" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="11" width="36" height="26" rx="4"/>
    <path d="M7 13 l17 13 l17-13"/>
  </symbol>
  <symbol id="icon-robot" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="15" width="28" height="22" rx="5"/>
    <path d="M24 15 v-7 M20 8 h8"/>
    <circle cx="18" cy="25" r="2.5" fill="currentColor" stroke="none"/>
    <circle cx="30" cy="25" r="2.5" fill="currentColor" stroke="none"/>
    <path d="M18 32 h12"/>
  </symbol>
</svg>
